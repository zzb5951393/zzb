<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102418" />
    <title>单机贪吃蛇</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="贪吃蛇游戏">
      <section class="hero-panel">
        <p class="eyebrow">ZZB Snake · Local Prototype</p>
        <h1>单机贪吃蛇</h1>
        <p class="intro">第一版本地网页原型：键盘、触屏都可以玩，游戏规则和素材都按模块拆分，后续方便替换。</p>
      </section>

      <section class="game-card" aria-label="游戏区域">
        <header class="hud" aria-label="游戏信息">
          <div>
            <span class="hud-label">分数</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="hud-label">最高</span>
            <strong id="best-score">0</strong>
          </div>
          <div>
            <span class="hud-label">状态</span>
            <strong id="status-text">准备</strong>
          </div>
        </header>

        <div class="board-wrap">
          <canvas id="game-canvas" width="480" height="480" aria-label="贪吃蛇棋盘"></canvas>
          <div id="overlay" class="overlay">
            <strong>点击开始</strong>
            <span>方向键 / WASD / 滑动屏幕控制方向</span>
          </div>
        </div>

        <div class="actions">
          <button id="start-button" type="button">开始 / 暂停</button>
          <button id="restart-button" type="button">重新开始</button>
        </div>

        <nav class="touch-pad" aria-label="手机方向控制">
          <button data-direction="up" aria-label="向上">▲</button>
          <button data-direction="left" aria-label="向左">◀</button>
          <button data-direction="right" aria-label="向右">▶</button>
          <button data-direction="down" aria-label="向下">▼</button>
        </nav>
      </section>
    </main>

    <script src="./src/game/config.js"></script>
    <script src="./src/game/state.js"></script>
    <script src="./src/game/input.js"></script>
    <script src="./src/game/renderer.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
